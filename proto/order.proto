syntax = "proto3";

message OrderItem {
  string product_id = 1;
  double price = 2;
  int32 quantity = 3;
}

message OrderRequest {
  string request_id = 1;
  repeated OrderItem items = 2;
}

message OrderResponse {
  string request_id = 1;
  int32 item_count = 2;
  double total_amount = 3;
  double average_item_price = 4;
}

service OrderService {
  rpc ProcessOrder(OrderRequest) returns (OrderResponse);
}